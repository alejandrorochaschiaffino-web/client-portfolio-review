name: Update market data

on:
  workflow_dispatch:          # "Run workflow" button on GitHub
  schedule:
    - cron: "0 22 * * 1"      # Mondays after the US market close

permissions:
  contents: write

concurrency:                  # never run two updates at once
  group: market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - run: python -m pytest -q
      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update market data snapshot"
          git pull --rebase origin main
          git push
